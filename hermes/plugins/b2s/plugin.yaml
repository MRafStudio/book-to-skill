name: b2s
label: BOOK → SKILL
kind: standalone
version: 0.1.0
description: >
  Детерминированная часть конвейера book-to-skill: загрузка источника (URL или
  локальный файл/папка), каскад стратегий извлечения, очистка текста от мусора
  сайта, отчёт по прогону и перенос готового черновика в skills/<категория>/.
  Маршруты монтируются под /api/plugins/b2s/ и вызываются панелью BOOK → SKILL
  напрямую — без участия LLM и без реплик в чате. LLM остаётся только на прозу
  глав и разбор черновика (это по-прежнему идёт через чат).
author: MRafStudio
